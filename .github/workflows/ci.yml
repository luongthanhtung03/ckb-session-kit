name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a dependency or a testnet change that breaks the build shows up
  # even in a week with no commits.
  schedule:
    - cron: "17 3 * * 1"

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    # Windows too: this library must behave the same wherever it is developed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        # package.json says node >=20: the oldest and the newest too, on Linux.
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      # Pack, install the tarball into an empty project, use it from there.
      - run: npm run pack:check

  # The on-chain session lock: build the Rust contract for RISC-V, then run the
  # whole suite against it in the real CKB-VM (ckb-testtool + ckb-debugger).
  session-lock:
    runs-on: ubuntu-latest
    env:
      REQUIRE_LOCK_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      # The pinned toolchain and target from contracts/session-lock/rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: contracts/session-lock
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            contracts/session-lock/target
          key: session-lock-${{ runner.os }}-${{ hashFiles('contracts/session-lock/rust-toolchain.toml', 'contracts/session-lock/Cargo.lock') }}
      - name: Build the session lock
        working-directory: contracts/session-lock
        run: cargo build --release --locked
      - name: Install ckb-debugger
        run: |
          version=v1.1.1
          url="https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/${version}/ckb-debugger_${version}_x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/ckb-debugger.tar.gz
          # The checksum v1.1.1's release publishes: a replaced asset fails here.
          echo "0dee02804af46386527c8bb94c2ee63592594ca1ec952ea42ffa9df07a9f005e  /tmp/ckb-debugger.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.ckb-tools"
          tar -xzf /tmp/ckb-debugger.tar.gz -C "$HOME/.ckb-tools"
          echo "$HOME/.ckb-tools" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/session-lock.test.ts

  # The deployed session lock, rebuilt from this source: its data hash must equal
  # the code hash in deployment/testnet.json. Windows, because the deployed binary
  # was built with rustc 1.99.0 on x86_64-pc-windows-gnu, and rustc and the linker
  # it ships write host-specific bytes (a Linux build works but differs). No target
  # cache here: the build starts from nothing, as a verifier's would.
  lock-hash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --target riscv64imac-unknown-none-elf
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: lock-hash-${{ runner.os }}-${{ hashFiles('contracts/session-lock/Cargo.lock') }}
      - name: Build the session lock
        working-directory: contracts/session-lock
        run: cargo build --release --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:lock-hash
